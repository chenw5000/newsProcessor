spring:
  application:
    name: newsprocessor-server
  config:
    import: optional:classpath:db.properties
  datasource:
    url: ${db.jdbcUrl}
    username: ${db.user}
    password: ${db.password}
    hikari:
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "2"

gemini:
  api-key: ${gemini.apiKey:${GEMINI_API_KEY:${GOOGLE_API_KEY:}}}
  model: gemini-3.5-flash-lite

news:
  schedule:
    # How often the scheduler re-reads app_setting and may start a run.
    tick-ms: 30000

server:
  port: 6060
  error:
    include-message: never
    include-stacktrace: never
